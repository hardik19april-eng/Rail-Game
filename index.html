<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Midnight Express</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#ebe4cf;user-select:none}
canvas{display:block}
.ui{position:fixed;pointer-events:none;text-shadow:0 0 6px #000,0 0 3px #000}
#vig{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px 40px rgba(0,0,0,.75)}
#hudTL{left:20px;top:16px;font-size:18px;line-height:1.55}
#hudTL b{color:#ffd47a}
#lim{right:24px;top:20px;width:92px;height:92px;border-radius:50%;background:#f4f1e8;border:9px solid #c8201c;color:#111;font:bold 38px 'Courier New',monospace;display:flex;align-items:center;justify-content:center;text-shadow:none;box-sizing:border-box}
#lim.over{background:#ff4a3a;color:#fff;animation:bl .4s infinite}
@keyframes bl{50%{opacity:.45}}
#sig{right:24px;top:126px;font-size:17px;text-align:right}
#msg{left:0;right:0;top:12%;text-align:center;font-size:26px;color:#fff}
#cue{left:0;right:0;top:22%;text-align:center;font-size:30px;color:#ff5a3c;display:none;animation:bl .5s infinite}
#panel{left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:18px;align-items:center;background:linear-gradient(#17120d,#0a0806);border:3px solid #3d3020;border-radius:14px;padding:10px 18px;box-shadow:0 0 30px #000}
#bars{width:280px;font-size:12px;color:#b9a97c}
.bar{height:12px;background:#201a12;border:1px solid #4a3d28;margin:3px 0 9px}
.bar i{display:block;height:100%;width:0;background:#d9a441}
#brk{background:#d6402e!important}#cmf{background:#58b36a!important}
#hint{font-size:11px;color:#8a7d5c;line-height:1.4}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#scare{position:fixed;inset:0;display:none;pointer-events:none}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(2,3,8,.82);white-space:pre-line;line-height:1.6}
#ov h1{font-size:68px;margin:0 0 8px;color:#c9322a;letter-spacing:5px;text-shadow:0 0 30px #600}
#ov p{font-size:19px;max-width:820px;margin:6px 0;color:#cfc7ad}
#ov .go{margin-top:18px;font-size:24px;color:#ffd47a}
</style>
</head>
<body>
<div id="vig"></div>
<div id="hudTL" class="ui"><div id="clock"></div><div id="next"></div><div id="dueL"></div><div id="score"></div></div>
<div id="lim" class="ui"><span id="limN">120</span></div>
<div id="sig" class="ui"></div>
<div id="msg" class="ui"></div>
<div id="cue" class="ui">BRAKE NOW</div>
<div id="panel" class="ui">
  <canvas id="dial" width="230" height="230"></canvas>
  <div id="bars">
    <div>THROTTLE</div><div class="bar"><i id="thr"></i></div>
    <div>BRAKE</div><div class="bar"><i id="brk"></i></div>
    <div>PASSENGER COMFORT</div><div class="bar"><i id="cmf"></i></div>
    <div id="hint">W/S throttle | SPACE brake | X emergency | H whistle<br>C camera | R rain | P pause | move mouse to look</div>
  </div>
</div>
<canvas id="scare"></canvas>
<div id="flash"></div>
<div id="ov"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(typeof THREE==='undefined'){document.body.innerHTML='<p style="color:#fff;padding:30px;font:20px sans-serif">Could not load Three.js. Connect to the internet and refresh the page.</p>';throw new Error('Three.js missing');}

// ================= MIDNIGHT EXPRESS =================
const $=id=>document.getElementById(id), rnd=(a,b)=>a+Math.random()*(b-a), clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const fmt=t=>{t=Math.max(0,t|0);return String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');};

// ---------- scene ----------
const FOGC=0x0a1020;
const scene=new THREE.Scene(); scene.background=new THREE.Color(FOGC); scene.fog=new THREE.Fog(FOGC,30,600);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.4,1500);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const hemi=new THREE.HemisphereLight(0x5a6a9a,0x10141c,.55); scene.add(hemi);
const moonL=new THREE.DirectionalLight(0x8fa0d8,.45); moonL.position.set(-200,300,100); scene.add(moonL);

// ---------- route ----------
const raw=[[0,500],[0,0],[40,-300],[160,-560],[360,-760],[620,-860],[880,-1000],[1000,-1250],[960,-1550],[800,-1800],[560,-1950],[300,-2100],[120,-2350],[0,-2650]];
const curve=new THREE.CatmullRomCurve3(raw.map(p=>V3(p[0]*2.2,0,p[1]*2.2)),false,'centripetal');
curve.arcLengthDivisions=6000;
const L=curve.getLength(), STEP=2, NS=Math.ceil(L/STEP)+3;
const SP=[],TG=[];
for(let i=0;i<NS;i++){const u=Math.min(1,i*STEP/L);SP.push(curve.getPointAt(u));const t=curve.getTangentAt(u);t.y=0;TG.push(t.normalize());}
function at(s){s=clamp(s,0,L-.05);const f=s/STEP,i=f|0,k=f-i;return{p:SP[i].clone().lerp(SP[i+1],k),t:TG[i].clone().lerp(TG[i+1],k).normalize()};}
const rightOf=t=>V3(-t.z,0,t.x);

const NAMES=['ASHFORD HALT','WILLOW CROSS','BLACKMERE','HOLLOW HILL'];
const ST=[1250,.36*L,.66*L,L-300].map(Math.round);
const DUE=ST.map((s,i)=>Math.round((s-ST[0])/20+16*i+8));
const S_RIVER=.24*L, S_TUN=.50*L, TUN_LEN=220, S_CROSS=.80*L;
const SIGS_S=[.20*L,.55*L,.76*L], GHOST_S=[.30*L,.58*L,.88*L];

// speed limit table (km/h) from track curvature
const LC=[];
for(let k=0;k*10<NS;k++){const a=TG[Math.max(0,k*10-10)],b=TG[Math.min(NS-1,k*10+10)];const kap=Math.acos(clamp(a.dot(b),-1,1))/40;const v=kap<1e-4?120:Math.sqrt(.75/kap)*3.6;LC.push(clamp(Math.floor(v/10)*10,50,120));}
function limitAt(q){
  let l=120;const i=Math.max(0,Math.floor(q/20));
  for(let j=i;j<=i+2&&j<LC.length;j++)l=Math.min(l,LC[j]);
  ST.forEach((st,k)=>{const d=st-q; if(k>0&&d>-20&&d<1300)l=Math.min(l,Math.max(30,Math.round((30+Math.max(0,d)*.07)/10)*10)); if(q-st>=0&&q-st<250)l=Math.min(l,50);});
  if(Math.abs(q-S_TUN)<TUN_LEN/2+80)l=Math.min(l,80);
  if(Math.abs(q-S_RIVER)<150)l=Math.min(l,70);
  if(Math.abs(q-S_CROSS)<250)l=Math.min(l,80);
  return l;
}
function allowed(s,d){
  for(const st of ST)if(Math.abs(s-st)<110&&d<48)return false;
  if(Math.abs(s-S_TUN)<TUN_LEN&&d<40)return false;
  if(Math.abs(s-S_RIVER)<120)return false;
  if(Math.abs(s-S_CROSS)<45&&d<45)return false;
  return s<L-40;
}

// ---------- helpers ----------
function mat(c){return new THREE.MeshLambertMaterial({color:c});}
function bx(par,w,h,d,col,x,y,z,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m||mat(col));o.position.set(x,y,z);par.add(o);return o;}
function cyl(par,rt,rb,h,col,x,y,z,m){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,14),m||mat(col));o.position.set(x,y,z);par.add(o);return o;}
function noiseTex(base,rx,ry){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,128,128);for(let i=0;i<900;i++){const v=Math.random()*45|0;g.fillStyle=`rgba(${v},${v+12},${v},.28)`;g.fillRect(Math.random()*128,Math.random()*128,2,2);}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t;}
function labelTex(txt,w,h,fg,bg,font){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,w,h);g.strokeStyle=fg;g.lineWidth=7;g.strokeRect(7,7,w-14,h-14);g.fillStyle=fg;g.font=font;g.textAlign='center';g.textBaseline='middle';g.fillText(txt,w/2,h/2);return new THREE.CanvasTexture(c);}
function ribbon(off,w,y,col,step){
  const pos=[],idx=[];let n=0;
  for(let s=0;s<=L;s+=step){const{p,t}=at(s),r=rightOf(t);pos.push(p.x+r.x*(off-w/2),y,p.z+r.z*(off-w/2),p.x+r.x*(off+w/2),y,p.z+r.z*(off+w/2));if(n>0){const a=(n-1)*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}n++;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:col,side:THREE.DoubleSide}));scene.add(m);return m;
}

// ---------- world: ground & track ----------
const ground=new THREE.Mesh(new THREE.PlaneGeometry(6000,9000),new THREE.MeshLambertMaterial({map:noiseTex('#1e3524',500,750)}));
ground.rotation.x=-Math.PI/2;ground.position.set(1100,0,-2400);scene.add(ground);
ribbon(0,4.8,.12,0x3a3a3f,3);
ribbon(-.72,.15,.36,0x9aa0aa,2);
ribbon(.72,.15,.36,0x9aa0aa,2);
{
  const n=Math.floor(L/1.7),m=new THREE.InstancedMesh(new THREE.BoxGeometry(2.8,.16,.45),mat(0x2b1d13),n),d=new THREE.Object3D();
  for(let i=0;i<n;i++){const{p,t}=at(i*1.7);d.position.set(p.x,.2,p.z);d.lookAt(p.x+t.x,.2,p.z+t.z);d.updateMatrix();m.setMatrixAt(i,d.matrix);}
  scene.add(m);
}
// trees
{
  const TN=1500,coneG=new THREE.ConeGeometry(2.3,7,7);coneG.translate(0,5.2,0);
  const trunkG=new THREE.CylinderGeometry(.28,.4,2.4,6);trunkG.translate(0,1.2,0);
  const cones=new THREE.InstancedMesh(coneG,new THREE.MeshLambertMaterial({color:0xffffff}),TN),trunks=new THREE.InstancedMesh(trunkG,mat(0x2a1d14),TN),d=new THREE.Object3D();
  let c=0;
  for(let tr=0;tr<TN*3&&c<TN;tr++){
    const s=rnd(0,L),side=Math.random()<.5?-1:1,dist=7+Math.pow(Math.random(),1.6)*170;
    if(!allowed(s,dist))continue;
    const{p,t}=at(s),r=rightOf(t),k=rnd(.7,1.7);
    d.position.set(p.x+r.x*dist*side,0,p.z+r.z*dist*side);d.rotation.set(0,rnd(0,6),0);d.scale.set(k,k*rnd(.9,1.3),k);d.updateMatrix();
    cones.setMatrixAt(c,d.matrix);trunks.setMatrixAt(c,d.matrix);
    cones.setColorAt(c,new THREE.Color().setHSL(rnd(.28,.4),rnd(.3,.5),rnd(.07,.16)));c++;
  }
  cones.count=trunks.count=c;cones.instanceColor.needsUpdate=true;scene.add(cones,trunks);
}
// hills
{
  const HN=130,m=new THREE.InstancedMesh(new THREE.SphereGeometry(1,10,6),new THREE.MeshLambertMaterial({color:0xffffff}),HN),d=new THREE.Object3D();
  for(let i=0;i<HN;i++){
    const s=rnd(0,L),side=Math.random()<.5?-1:1,rad=rnd(35,120),dist=rad*.95+45+rnd(0,260);
    const{p,t}=at(s),r=rightOf(t);
    d.position.set(p.x+r.x*dist*side,-2,p.z+r.z*dist*side);d.rotation.set(0,rnd(0,6),0);d.scale.set(rad,rnd(14,50),rad*rnd(.8,1.3));d.updateMatrix();
    m.setMatrixAt(i,d.matrix);m.setColorAt(i,new THREE.Color().setHSL(rnd(.25,.38),.25,rnd(.05,.1)));
  }
  m.instanceColor.needsUpdate=true;scene.add(m);
}
// telegraph poles and wires
{
  const tops=[],poleG=new THREE.CylinderGeometry(.13,.16,7,6);poleG.translate(0,3.5,0);
  const list=[];
  for(let s=40;s<L-40;s+=50){if(Math.abs(s-S_RIVER)<90||Math.abs(s-S_TUN)<TUN_LEN/2+30)continue;list.push(s);}
  const poles=new THREE.InstancedMesh(poleG,mat(0x2d2218),list.length),arms=new THREE.InstancedMesh(new THREE.BoxGeometry(2.4,.14,.14),mat(0x2d2218),list.length),d=new THREE.Object3D(),wp=[];
  let prev=null;
  list.forEach((s,i)=>{
    const{p,t}=at(s),r=rightOf(t),x=p.x-r.x*5.6,z=p.z-r.z*5.6;
    d.position.set(x,.1,z);d.lookAt(x+t.x,.1,z+t.z);d.updateMatrix();poles.setMatrixAt(i,d.matrix);
    d.position.set(x,6.6,z);d.updateMatrix();arms.setMatrixAt(i,d.matrix);
    const cur=[-.9,.9].map(e=>V3(x+r.x*e,6.6,z+r.z*e));
    if(prev&&s-prev.s<=55)for(let k=0;k<2;k++){const a=prev.c[k],b=cur[k],m=a.clone().add(b).multiplyScalar(.5);m.y-=.7;wp.push(a.x,a.y,a.z,m.x,m.y,m.z,m.x,m.y,m.z,b.x,b.y,b.z);}
    prev={s,c:cur};
  });
  scene.add(poles,arms);
  const wg=new THREE.BufferGeometry();wg.setAttribute('position',new THREE.Float32BufferAttribute(wp,3));
  scene.add(new THREE.LineSegments(wg,new THREE.LineBasicMaterial({color:0x252b38})));
}

// ---------- stations ----------
const stationLights=[];
ST.forEach((st,idx)=>{
  const PM=mat(0x3b3b42),RM=mat(0x4a1c1c);
  for(let s=st-72,i=0;s<=st+16;s+=6,i++){
    const{p,t}=at(s),r=rightOf(t);
    const b=new THREE.Mesh(new THREE.BoxGeometry(4.4,.95,6.3),PM);b.position.set(p.x+r.x*4.7,.475,p.z+r.z*4.7);b.lookAt(b.position.x+t.x,.475,b.position.z+t.z);scene.add(b);
    const rf=new THREE.Mesh(new THREE.BoxGeometry(5.8,.18,6.4),RM);rf.position.set(p.x+r.x*5.1,4.3,p.z+r.z*5.1);rf.lookAt(rf.position.x+t.x,4.3,rf.position.z+t.z);scene.add(rf);
    if(i%2===0){
      const po=cyl(scene,.12,.12,3.4,0x222222,p.x+r.x*6.6,2.65,p.z+r.z*6.6);
      const lp=new THREE.Mesh(new THREE.SphereGeometry(.2,8,8),new THREE.MeshBasicMaterial({color:0xffe3a0}));lp.position.set(p.x+r.x*4.7,3.95,p.z+r.z*4.7);scene.add(lp);
    }
  }
  {const{p,t}=at(st-30),r=rightOf(t);const L1=new THREE.PointLight(0xffd9a0,1.25,75);L1.position.set(p.x+r.x*4.7,3.7,p.z+r.z*4.7);scene.add(L1);
   const bld=new THREE.Mesh(new THREE.BoxGeometry(9,4.6,17),mat(0x2a2320));bld.position.set(p.x+r.x*14,2.3,p.z+r.z*14);bld.lookAt(bld.position.x+t.x,2.3,bld.position.z+t.z);scene.add(bld);
   const wd=new THREE.Mesh(new THREE.PlaneGeometry(10,1.2),new THREE.MeshBasicMaterial({color:0xcfa95a}));wd.position.set(p.x+r.x*9.45,2.5,p.z+r.z*9.45);wd.lookAt(p.x,2.5,p.z);scene.add(wd);}
  {const{p,t}=at(st-48),r=rightOf(t);const sg=new THREE.Mesh(new THREE.PlaneGeometry(7,1.5),new THREE.MeshBasicMaterial({map:labelTex(NAMES[idx],700,150,'#f2e8c9','#10253f','bold 64px Courier New')}));
   sg.position.set(p.x+r.x*6.9,3.2,p.z+r.z*6.9);sg.lookAt(p.x,3.2,p.z);scene.add(sg);}
  {const{p,t}=at(st),r=rightOf(t);
   cyl(scene,.07,.07,1.8,0x888888,p.x+r.x*2.75,1.85,p.z+r.z*2.75);
   const sb=new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.1),new THREE.MeshBasicMaterial({map:labelTex('STOP','256','190'.length&&190?190:190,'#fff','#b3201c','bold 70px Courier New')}));
   sb.position.set(p.x+r.x*2.75,2.4,p.z+r.z*2.75);sb.lookAt(p.x,2.4,p.z);scene.add(sb);}
  for(let k=0;k<6;k++){
    const s=st-rnd(5,62),{p,t}=at(s),r=rightOf(t),o=3.7+rnd(0,2.2),fg=new THREE.Group();
    cyl(fg,.22,.28,1.3,0x14141a,0,.65,0);const hd=new THREE.Mesh(new THREE.SphereGeometry(.17,8,8),mat(0xc9bfae));hd.position.y=1.45;fg.add(hd);
    fg.position.set(p.x+r.x*o,.95,p.z+r.z*o);scene.add(fg);
  }
  if(idx===ST.length-1){const{p,t}=at(L-8);const g=new THREE.Group();bx(g,3.4,1.1,.7,0xaa2222,0,.7,0);bx(g,.3,2,.3,0x444444,-1.3,1,-.2);bx(g,.3,2,.3,0x444444,1.3,1,-.2);g.position.copy(p);g.lookAt(p.x+t.x,0,p.z+t.z);scene.add(g);}
});

// ---------- river & bridge ----------
{
  const{p,t}=at(S_RIVER),g=new THREE.Group();g.position.set(p.x,.04,p.z);g.lookAt(p.x+t.x,.04,p.z+t.z);
  const w=new THREE.Mesh(new THREE.PlaneGeometry(900,80),new THREE.MeshStandardMaterial({color:0x0a1a30,roughness:.2,metalness:.6,emissive:0x050a14}));w.rotation.x=-Math.PI/2;g.add(w);scene.add(g);
  for(let s=S_RIVER-36;s<=S_RIVER+36;s+=6){
    const a=at(s),r=rightOf(a.t);
    [-1,1].forEach(side=>{
      const gr=new THREE.Mesh(new THREE.BoxGeometry(.3,1.8,6.2),mat(0x3a3f48));gr.position.set(a.p.x+r.x*2.45*side,1.3,a.p.z+r.z*2.45*side);gr.lookAt(gr.position.x+a.t.x,1.3,gr.position.z+a.t.z);scene.add(gr);
      const tp=new THREE.Mesh(new THREE.BoxGeometry(.34,.25,6.2),mat(0x2a2e36));tp.position.set(a.p.x+r.x*2.45*side,2.25,a.p.z+r.z*2.45*side);tp.lookAt(tp.position.x+a.t.x,2.25,tp.position.z+a.t.z);scene.add(tp);
    });
    const dk=new THREE.Mesh(new THREE.BoxGeometry(5.4,.4,6.4),mat(0x23262c));dk.position.set(a.p.x,.0,a.p.z);dk.lookAt(dk.position.x+a.t.x,0,dk.position.z+a.t.z);scene.add(dk);
    if(Math.round((s-S_RIVER)/6)%3===0){const pr=new THREE.Mesh(new THREE.BoxGeometry(1.4,6,1.4),mat(0x30343b));pr.position.set(a.p.x,-2.6,a.p.z);scene.add(pr);}
  }
}
// ---------- tunnel ----------
{
  const s0=S_TUN-TUN_LEN/2,sm=new THREE.MeshLambertMaterial({color:0x4b4f55,side:THREE.DoubleSide});
  const sg=new THREE.CylinderGeometry(5.6,5.6,10.3,14,1,true,Math.PI/2,Math.PI);sg.rotateX(Math.PI/2);
  const hillMat=mat(0x14231a),hg=new THREE.SphereGeometry(1,12,8);
  for(let s=s0+5;s<s0+TUN_LEN;s+=10){const{p,t}=at(s),m=new THREE.Mesh(sg,sm);m.position.set(p.x,.1,p.z);m.lookAt(p.x+t.x,.1,p.z+t.z);scene.add(m);}
  for(let s=s0+6;s<=s0+TUN_LEN-6;s+=8){const{p,t}=at(s),h=new THREE.Mesh(hg,hillMat);h.scale.set(15,13,5.5);h.position.set(p.x,-1.5,p.z);h.lookAt(p.x+t.x,-1.5,p.z+t.z);scene.add(h);}
  [s0,s0+TUN_LEN].forEach(s=>{const{p,t}=at(s),m=new THREE.Mesh(new THREE.TorusGeometry(5.75,.6,6,16,Math.PI),mat(0x2a2d33));m.position.set(p.x,.1,p.z);m.lookAt(p.x+t.x,.1,p.z+t.z);scene.add(m);});
  for(let s=s0+15;s<s0+TUN_LEN;s+=22){const{p}=at(s),l=new THREE.Mesh(new THREE.BoxGeometry(.5,.2,.5),new THREE.MeshBasicMaterial({color:0xff9a3a}));l.position.set(p.x,5.3,p.z);scene.add(l);}
}

// ---------- level crossing ----------
const crossing={lamps:[],arms:[],state:0};
{
  const{p,t}=at(S_CROSS),g=new THREE.Group();g.position.set(p.x,0,p.z);g.lookAt(p.x+t.x,0,p.z+t.z);scene.add(g);
  bx(g,34,.14,7,0x1c1c20,0,.13,0);
  [-1,1].forEach((side,i)=>{
    bx(g,.16,3.2,.16,0x222222,side*4.3,1.6,-3.6);

// ---------- update ----------
function update(dt){
  G.t+=dt;G.msgT-=dt;G.flash=Math.max(0,G.flash-dt*2);
  const q=G.s-3.6,boarding=G.phase==='board';
  if(boarding)G.thr=0;
  else{if(keys.KeyW||keys.ArrowUp)G.thr+=dt*.45;if(keys.KeyS||keys.ArrowDown)G.thr-=dt*.8;}
  G.thr=clamp(G.thr,0,1);G.em=!!keys.KeyX;
  const tgt=(boarding||keys.Space||keys.KeyB||G.em)?1:0;
  G.bk+=clamp(tgt-G.bk,-2.5*dt,(G.em?9:1.6)*dt);
  const dec=G.bk*(G.em?2.5:1.15),acc=G.thr*1.15*Math.max(0,1-G.v/44);
  const nv=Math.max(0,G.v+(acc-(.02+.0009*G.v)-dec)*dt),decAct=(G.v-nv)/dt;
  G.v=nv;G.s+=G.v*dt;G.wheel+=G.v*dt/.95;
  const kmh=G.v*3.6,lim=limitAt(q);

  // comfort and speeding
  if(decAct>1.6&&G.v>2)G.comfort-=(decAct-1.5)*7*dt;
  if(kmh>lim+4&&!boarding){G.over+=dt;G.comfort-=.6*dt;G.beep-=dt;if(G.beep<=0){tone(900,.1,.1,'square');G.beep=.8;}if(G.over>6){G.over=0;G.score-=50;say('SPEEDING! Fined 50 points.');}}
  else G.over=Math.max(0,G.over-dt*2);
  G.comfort=clamp(G.comfort,0,100);

  // stations
  if(boarding){
    G.board-=dt;
    if(G.board<=0){
      if(G.next>=ST.length||G.finalDone){endGame();return;}
      G.phase='drive';say('Doors closed. You may depart!');tone(520,.3,.15);
    }
  }else if(G.next<ST.length){
    const st=ST[G.next],d=st-q;
    if(G.v<.35&&Math.abs(d)<30&&G.bk>.1){
      const e=Math.abs(d),pts=e<=2.5?500:e<=8?300:e<=20?150:60,late=G.t-DUE[G.next],tb=clamp(300-Math.max(0,late)*4,0,300);
      G.score+=pts+Math.round(tb);G.res.push(NAMES[G.next]+': '+(e<=2.5?'PERFECT':e<=8?'Good':e<=20?'Okay':'Rough')+' stop (+'+(pts+Math.round(tb))+')'+(late>0?', '+Math.round(late)+'s late':''));
      say((e<=2.5?'PERFECT STOP! ':'Stopped. ')+NAMES[G.next]+' +'+(pts+Math.round(tb)),4);tone(660,.5,.2);setTimeout(()=>tone(880,.7,.2),300);
      G.phase='board';G.board=G.next===ST.length-1?3:6;G.finalDone=G.next===ST.length-1;G.next++;
    }else if(d<-30){
      G.score-=300;G.comfort=Math.max(0,G.comfort-10);G.res.push(NAMES[G.next]+': MISSED (-300)');say('YOU MISSED '+NAMES[G.next]+'!',4);tone(120,.6,.3,'square');
      if(G.next===ST.length-1){G.finalDone=true;G.phase='board';G.board=2.5;}G.next++;
    }
  }
  // signals
  for(const sg of signals){
    if(sg.passed)continue;const d=sg.s-q;
    if(sg.red&&d<520&&!sg.counting){sg.counting=true;sg.timer=rnd(9,17);}
    if(sg.counting&&sg.red){sg.timer-=dt;if(sg.timer<=0){sg.red=false;setSig(sg);tone(1200,.08,.1,'square');}}
    if(d<0){sg.passed=true;if(sg.red){G.score-=300;G.comfort=Math.max(0,G.comfort-15);say('SIGNAL PASSED AT DANGER!',4);tone(100,.8,.35,'square');}}
  }
  // crossing
  {const d=S_CROSS-q,act=d>-70&&d<420;
   G.bell-=dt;if(act&&G.bell<=0){tone(1040,.12,.1,'square');G.bell=.45;crossing.state=1-crossing.state;}
   crossing.lamps.forEach((l,i)=>l.material.color.set(act&&(i%2===crossing.state)?0xff2a20:0x300808));
   crossing.arms.forEach(pv=>{const lo=0,hi=pv.userData.up;pv.rotation.z+=((act?lo:hi)-pv.rotation.z)*Math.min(1,dt*1.8);});}
  // ghosts
  for(const g of ghosts){
    if(g.state==='gone')continue;const d=g.s-q;
    if(d<-6){g.state='gone';g.obj.visible=false;continue;}
    if(g.state==='idle'&&d<300){g.state='near';say('Someone is standing on the track...',4);whisper();}

    if(d<9&&G.v>1.2){jumpscare();g.state='gone';g.obj.visible=false;say('It was never there...',3);}
    if(G.v<.8&&d<95&&d>0){g.wait+=dt;if(g.wait>4){g.state='gone';g.obj.visible=false;say("It's gone. You feel watched.",4);whisper();}}else g.wait=0;
  }
  // sounds
  const rate=Math.max(1.4,Math.min(9,G.v/(2*Math.PI*.95)*4));G.chuff+=dt*rate;
  if(G.chuff>=1){G.chuff-=1;burst(260,.9,.12,.2*(.3+G.thr*.9),'lowpass');puff(locoG.localToWorld(V3(0,4.7,6.4)),.6+G.thr);}

}

  dg.strokeStyle='#c22';dg.lineWidth=6;dg.beginPath();dg.arc(c,c,c-16,ang(lim),ang(MAX));dg.stroke();
  dg.strokeStyle='#d8cfae';dg.fillStyle='#d8cfae';dg.font='13px Courier New';dg.textAlign='center';dg.textBaseline='middle';
  for(let v=0;v<=MAX;v+=10){const a=ang(v),big=v%20===0,r1=c-24,r2=r1-(big?15:8);dg.lineWidth=big?3:1.5;dg.beginPath();dg.moveTo(c+Math.cos(a)*r1,c+Math.sin(a)*r1);dg.lineTo(c+Math.cos(a)*r2,c+Math.sin(a)*r2);dg.stroke();if(big)dg.fillText(v,c+Math.cos(a)*(r2-14),c+Math.sin(a)*(r2-14));}
  const a=ang(kmh);dg.strokeStyle='#ff4a2a';dg.lineWidth=4;dg.beginPath();dg.moveTo(c,c);dg.lineTo(c+Math.cos(a)*(c-38),c+Math.sin(a)*(c-38));dg.stroke();
  dg.fillStyle='#222';dg.beginPath();dg.arc(c,c,9,0,7);dg.fill();
  dg.fillStyle='#ffd47a';dg.font='bold 26px Courier New';dg.fillText(Math.round(kmh),c,c+52);dg.font='11px Courier New';dg.fillStyle='#8a7d5c';dg.fillText('km/h',c,c+72);
}
function hud(){
  const q=G.s-3.6,kmh=G.v*3.6,lim=limitAt(q);
  $('clock').innerHTML='TIME <b>'+fmt(G.t)+'</b>';
  const nx=Math.min(G.next,ST.length-1),d=ST[nx]-q;
  $('next').innerHTML='NEXT <b>'+NAMES[nx]+'</b> '+(G.next>=ST.length?'(arrived)':Math.max(0,Math.round(d))+' m');
  $('dueL').innerHTML='DUE <b>'+fmt(DUE[nx])+'</b>'+(G.t>DUE[nx]&&G.next<ST.length?' <span style="color:#f55">LATE</span>':'');
  $('score').innerHTML='SCORE <b>'+G.score+'</b>';
  $('limN').textContent=lim;$('lim').className='ui'+(kmh>lim+4&&G.phase==='drive'?' over':'');
  let sgTxt='';for(const sg of signals){const d=sg.s-q;if(!sg.passed&&d>0&&d<900){sgTxt='SIGNAL <span style="color:'+(sg.red?'#ff4a3a':'#5fff80')+'">'+(sg.red?'RED':'GREEN')+'</span> '+Math.round(d)+' m';break;}}
  $('sig').innerHTML=sgTxt;
  $('msg').textContent=G.msgT>0?G.msg:(G.phase==='board'?'Passengers boarding... '+Math.max(0,Math.ceil(G.board)):'');
  const need=G.v*G.v/(2*.95)+70;$('cue').style.display=(G.phase==='drive'&&G.next<ST.length&&G.v>6&&d>0&&need>d)?'block':'none';
  $('thr').style.width=G.thr*100+'%';$('brk').style.width=G.bk*100+'%';$('cmf').style.width=G.comfort+'%';
  drawDial(kmh,lim);
}

// ---------- camera and environment ----------
function cameraUpdate(dt){
  const q=G.s-3.6;
  if(state==='title'){
    const a=at(ST[0]),r=rightOf(a.t),ang=performance.now()/9000;
    camera.position.set(a.p.x+r.x*14+Math.cos(ang)*6,4+Math.sin(ang)*1.2,a.p.z+r.z*14+Math.sin(ang)*6-10);camera.lookAt(locoG.position.x,2.5,locoG.position.z);return;
  }
  if(camMode===0){
    const ep=locoG.localToWorld(V3(0,3.55,-3.6)),vv=G.v/20;
    const bump=(Math.sin(G.t*13.1)*.012+Math.sin(G.t*7.3)*.01)*vv;
    camera.position.set(ep.x,ep.y+bump,ep.z);
    const lx=(mouse.x-.5)*22,ly=-(mouse.y-.5)*9;
    camera.lookAt(locoG.localToWorld(V3(-lx,3.0+ly,40)));camera.rotateZ(bump*.6);
  }else if(camMode===1){
    const a=at(G.s-52),tp=a.p.clone().add(V3(0,9,0)).add(rightOf(a.t).multiplyScalar(7));
    camera.position.lerp(tp,.1);camera.lookAt(locoG.position.x,3.2,locoG.position.z);
  }else{
    if(G.cs===null||G.cs-q<-30||G.cs-q>260){G.cs=q+rnd(110,200);const a=at(G.cs);G.cpos=a.p.clone().add(rightOf(a.t).multiplyScalar((Math.random()<.5?-1:1)*rnd(7,12))).add(V3(0,rnd(1.6,3.5),0));}
    camera.position.copy(G.cpos);camera.lookAt(locoG.position.x,2.5,locoG.position.z);
  }
}
function environment(dt){
  skyG.position.copy(camera.position);
  // wheels and rods
  wheels.forEach(w=>{w.g.rotation.x=G.wheel;});
  rods.forEach(r=>{r.m.position.y=.95+Math.cos(G.wheel)*.4;r.m.position.z=1.7+Math.sin(G.wheel)*.4;});
  locoG.userData.fire.intensity=.8+Math.random()*.5;
  // smoke
  for(const p of puffs){if(!p.sp.visible)continue;p.age+=dt;if(p.age>p.life){p.sp.visible=false;continue;}
    const k=p.age/p.life;p.sp.position.addScaledVector(p.vel,dt);p.vel.y*=.99;p.sp.scale.setScalar((1.5+k*7)*p.k);p.sp.material.opacity=(1-k)*.5;}
  // rain
  rain.visible=rainOn;
  if(rainOn){
    const{t}=at(clamp(G.s,0,L-1));const vx=t.x*G.v,vz=t.z*G.v,rvx=-vx,rvy=-42,rvz=-vz;
    for(let i=0;i<RN;i++){
      let x=rainHead[i*3]+rvx*dt,y=rainHead[i*3+1]+rvy*dt,z=rainHead[i*3+2]+rvz*dt;
      if(y<-12){y+=42;x=rnd(-45,45);z=rnd(-45,45);}
      if(x<-45)x+=90;if(x>45)x-=90;if(z<-45)z+=90;if(z>45)z-=90;
      rainHead[i*3]=x;rainHead[i*3+1]=y;rainHead[i*3+2]=z;
      rainPos[i*6]=x;rainPos[i*6+1]=y;rainPos[i*6+2]=z;rainPos[i*6+3]=x-rvx*.03;rainPos[i*6+4]=y-rvy*.03;rainPos[i*6+5]=z-rvz*.03;
    }
    rainGeo.attributes.position.needsUpdate=true;rain.position.copy(camera.position);
    lightning.t-=dt;if(lightning.t<=0){lightning.flash=1;lightning.t=rnd(14,34);setTimeout(thunder,rnd(600,1800));}
  }
  lightning.flash=Math.max(0,lightning.flash-dt*3);
  const f=Math.max(lightning.flash*(Math.random()<.7?1:.3),G.flash*.25);
  hemi.intensity=.55+f*2.4;scene.background.setHex(FOGC).lerp(new THREE.Color(0x8fa0cc),f*.55);scene.fog.color.copy(scene.background);
  $('flash').style.opacity=0;
}

// ---------- main loop ----------
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play')update(dt);
  if(state==='play'||state==='end'||state==='title'||state==='pause'){
    if(state!=='pause')placeTrain();
    cameraUpdate(dt);if(state!=='pause')environment(dt);
  }
  if(state==='play'||state==='end')hud();
  drawScare(state==='play'?dt:0);
  renderer.render(scene,camera);
}
function showTitle(){
  $('ov').style.display='flex';
  $('ov').innerHTML='<h1>MIDNIGHT EXPRESS</h1><p>You are the night driver of the last steam train on the Hollow Line.<br>Stop at all four stations. Obey the signals and the speed limits.<br>Keep the passengers comfortable and the timetable on time.</p><p style="color:#b88">Something has been seen standing on the tracks after dark.<br>If you see it, stop the train and wait.</p><p>W / S: throttle &nbsp; SPACE: brake &nbsp; X: emergency brake<br>H: whistle &nbsp; C: camera &nbsp; R: rain &nbsp; P: pause &nbsp; Mouse: look around<br>Tip: start braking early. The BRAKE NOW warning helps.</p><div class="go">Press ENTER to start</div>';
}
newGame();placeTrain();showTitle();requestAnimationFrame(frame);

// ---------- input ----------
addEventListener('keydown',e=>{
  if(e.repeat&&e.code!=='KeyW'&&e.code!=='KeyS')return;
  keys[e.code]=true;
  if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
  if(e.code==='Enter'&&state==='title'){initAudio();newGame();state='play';$('ov').style.display='none';say('Boarding. Release the brake with W when the doors close.',4);}
  if(state!=='play')return;
  if(e.code==='KeyH')whistle(true);
  if(e.code==='KeyC'){camMode=(camMode+1)%3;G.cs=null;}
  if(e.code==='KeyR')rainOn=!rainOn;
  if(e.code==='KeyP'){state='pause';$('ov').style.display='flex';$('ov').innerHTML='<h1 style="font-size:50px">PAUSED</h1><div class="go">Press P to resume</div>';whistle(false);}
});
addEventListener('keydown',e=>{if(e.code==='KeyP'&&state==='pause'&&!e.repeat){state='play';$('ov').style.display='none';}});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='KeyH')whistle(false);});
addEventListener('mousemove',e=>{mouse.x=e.clientX/innerWidth;mouse.y=e.clientY/innerHeight;});
</script>
